[project]
name = "tech-atlas"
version = "0.1.0"
description = "Tech Atlas — horizon-categorized source register API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pymongo>=4.8",
    "anthropic>=1.0",
    "json-repair>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "openai>=1.50",
    "deepagents>=0.7.13",
    "langgraph>=0.2",
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.7.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "playwright>=1.45",
    "protego>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
